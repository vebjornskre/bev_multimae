# Traning specific parameters

train_mode: pretrain

# batch_size: 128
batch_size: 64
# batch_size: 264
num_workers: 8
prefetch_factor: 4
# lr: 9e-4
lr: 3e-4
max_epochs: 200
min_epochs: 1
# num_encoded_tokens: 100

# num_encoded_tokens: 156 # For 2 modalities  Gives 24.1% coverage
num_encoded_tokens: 234 # For 3 modalities
# num_encoded_tokens: 274

# num_encoded_tokens: 200
weight_decay: 0.1
warmup_steps: 1000
drop_path_rate: 0.4
drop_rate: 0.05
attn_drop_rate: 0.0

norm_pix: False

log_every_n_steps: 10
save_top_k: 1
optimizer: 'adamw'
    
# Data augment
augment: True
v_flip_rate: 0.5
h_flip_rate: 0.5
rot_rate: 0.5
rot_angle: [-180, 180]
viz_augment: False

continue_training: False

# best_model: best_model_epoch=86_val_total_loss_unweighted=1.9718 # Best pretrained model
best_model: final_model_no_normPix # Best pretrained model with norm_pix = False

load_old_pretrain: true
# old_pretrain_checkpoint: "best_model_epoch=202_val_loss=4.3025_best_384_dim.ckpt" # Used by best
old_pretrain_checkpoint: "best_model_epoch=86_val_total_loss_unweighted=1.9718.ckpt"

new_lr: True  

matmul_precision: high
profile: false
profile_path: 'profiling/train.prof'

# bev_feat_patch_size: 3 # with 2d features then project
bev_feat_patch_size: 1 # with direct BEV features
feat_weight: 4.0 
camera_weight: 5.0 
rad_weight: 1.0

model_folder: "model_checkpoints"

