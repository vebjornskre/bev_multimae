# Traning specific parameters

batch_size: 128
# batch_size: 264
num_workers: 8
prefetch_factor: 4
lr: 1e-5
# lr: 1.6e-3
max_epochs: 1
min_epochs: 1
# num_encoded_tokens: 100
num_encoded_tokens: 156
# num_encoded_tokens: 200
weight_decay: 0.1
warmup_steps: 1000
drop_path_rate: 0.5
drop_rate: 0.05
attn_drop_rate: 0.0

norm_pix: True

log_every_n_steps: 10
save_top_k: 1
optimizer: 'adamw'
    
# Data augment
augment: True
v_flip_rate: 0.5
h_flip_rate: 0.5
rot_rate: 0.5
rot_angle: [-90, 90]
viz_augment: False

continue_training: False
best_model: 'best_model_epoch=48_val_loss=9.6133'
new_lr: True